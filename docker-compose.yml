# ==============================================================================
# CyberAssess Platform - Standalone + Enterprise Docker Compose Orchestration
# Authoritative Contract References: contracts/01_PROJECT_SCOPE_AND_SAFETY_CONTRACT.md (§4.2),
# contracts/03_ENGINE_PLUGIN_INTERFACE_CONTRACT.md (§3)
# ==============================================================================

version: '3.8'

services:
  # Standalone/local profile. Public binding remains explicit at the Compose
  # boundary because container port publishing is itself an operator choice.
  cyberassess:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${CYBERASSESS_LOCAL_IMAGE:-cyberassess:local}
    container_name: cyberassess-platform
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${CYBERASSESS_PORT:-8000}:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    networks:
      - control-plane
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Enterprise control plane. The image reference MUST be supplied by the
  # operator and should be an immutable digest reference (name@sha256:...).
  cyberassess-enterprise:
    profiles: ["enterprise"]
    image: ${CYBERASSESS_IMAGE:?CYBERASSESS_IMAGE must be an immutable production image reference}
    container_name: cyberassess-platform-enterprise
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    ports:
      - "${CYBERASSESS_BIND_ADDRESS:-127.0.0.1}:${CYBERASSESS_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cyberassess}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cyberassess}"
      EXECUTION_QUEUE_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set for enterprise mode}"
      TARGET_GATEWAY_SEAL_SECRET: "${TARGET_GATEWAY_SEAL_SECRET:?TARGET_GATEWAY_SEAL_SECRET must be separately provisioned}"
      CLOUD_CREDENTIALS_ENCRYPTION_KEY: "${CLOUD_CREDENTIALS_ENCRYPTION_KEY:?CLOUD_CREDENTIALS_ENCRYPTION_KEY must be a separately provisioned 32-byte base64 key}"
      ENVIRONMENT: production
    volumes:
      - ./data:/app/data
    networks:
      - control-plane
      - data-plane
      - provider-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Enterprise execution plane. The execution-egress network is external on
  # purpose: CyberAssess refuses to manufacture an unrestricted bridge and
  # delegates packet-level destination enforcement to a separately governed
  # firewall/egress-gateway network owned by infrastructure.
  cyberassess-worker:
    profiles: ["enterprise"]
    image: ${CYBERASSESS_IMAGE:?CYBERASSESS_IMAGE must be an immutable production image reference}
    container_name: cyberassess-worker
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    command: ["python", "/app/run_worker.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cyberassess}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-cyberassess}"
      EXECUTION_QUEUE_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set for enterprise mode}"
      TARGET_GATEWAY_SEAL_SECRET: "${TARGET_GATEWAY_SEAL_SECRET:?TARGET_GATEWAY_SEAL_SECRET must be separately provisioned}"
      CLOUD_CREDENTIALS_ENCRYPTION_KEY: "${CLOUD_CREDENTIALS_ENCRYPTION_KEY:?CLOUD_CREDENTIALS_ENCRYPTION_KEY must be a separately provisioned 32-byte base64 key}"
      ENVIRONMENT: production
    volumes:
      - ./data:/app/data
    networks:
      - data-plane
      - execution-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    profiles: ["enterprise"]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: cyberassess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cyberassess}"
      POSTGRES_USER: "${POSTGRES_USER:-cyberassess}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - cyberassess-postgres:/var/lib/postgresql/data
    networks:
      - data-plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["enterprise"]
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: cyberassess-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - cyberassess-redis:/data
    networks:
      - data-plane
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cyberassess-postgres:
  cyberassess-redis:

networks:
  control-plane:
    driver: bridge
  data-plane:
    driver: bridge
    internal: true

  # These are NOT created by this Compose project. Infrastructure must
  # provision them with destination filtering/egress-gateway policy first.
  # Defaults are stable names so standalone parsing does not require enterprise
  # variables; `docker compose --profile enterprise up` fails if they are absent.
  execution-egress:
    external: true
    name: ${CYBERASSESS_EXECUTION_EGRESS_NETWORK:-cyberassess-execution-egress}
  provider-egress:
    external: true
    name: ${CYBERASSESS_PROVIDER_EGRESS_NETWORK:-cyberassess-provider-egress}
