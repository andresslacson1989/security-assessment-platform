# ==============================================================================
# CyberAssess Platform - Production Docker Compose Orchestration
# Authoritative Contract References: contracts/01_PROJECT_SCOPE_AND_SAFETY_CONTRACT.md (§4.2),
# contracts/03_ENGINE_PLUGIN_INTERFACE_CONTRACT.md (§3)
# ==============================================================================

services:
  cyberassess:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andresslacson1989/security-assessment-platform:latest
    container_name: cyberassess-platform
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent host volume for scan reports and database
      - ./data:/app/data
    networks:
      - control-plane
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Enterprise profile: PostgreSQL persistence and Redis Streams dispatch.
  # Keep DATABASE_URL, POSTGRES_PASSWORD, and other credentials outside source control.
  cyberassess-enterprise:
    profiles: ["enterprise"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andresslacson1989/security-assessment-platform:latest
    container_name: cyberassess-platform-enterprise
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must reference the enterprise PostgreSQL service}"
      EXECUTION_QUEUE_URL: "${EXECUTION_QUEUE_URL:?EXECUTION_QUEUE_URL must reference the enterprise Redis service}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set for enterprise mode}"
      CLOUD_CREDENTIALS_ENCRYPTION_KEY: "${CLOUD_CREDENTIALS_ENCRYPTION_KEY:?CLOUD_CREDENTIALS_ENCRYPTION_KEY must be a separately provisioned 32-byte base64 key}"
      ENVIRONMENT: production
      SCANNER_EGRESS_PROXY: "${SCANNER_EGRESS_PROXY:-}"
    volumes:
      - ./data:/app/data
    networks:
      - control-plane
      - data-plane
      - provider-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cyberassess-worker:
    profiles: ["enterprise"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andresslacson1989/security-assessment-platform:latest
    container_name: cyberassess-worker
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    command: ["python", "/app/run_worker.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must reference the enterprise PostgreSQL service}"
      EXECUTION_QUEUE_URL: "${EXECUTION_QUEUE_URL:?EXECUTION_QUEUE_URL must reference the enterprise Redis service}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set for enterprise mode}"
      CLOUD_CREDENTIALS_ENCRYPTION_KEY: "${CLOUD_CREDENTIALS_ENCRYPTION_KEY:?CLOUD_CREDENTIALS_ENCRYPTION_KEY must be a separately provisioned 32-byte base64 key}"
      ENVIRONMENT: production
      SCANNER_EGRESS_PROXY: "${SCANNER_EGRESS_PROXY:-}"
    volumes:
      - ./data:/app/data
    networks:
      - data-plane
      - execution-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    profiles: ["enterprise"]
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: cyberassess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cyberassess}"
      POSTGRES_USER: "${POSTGRES_USER:-cyberassess}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - cyberassess-postgres:/var/lib/postgresql/data
    networks:
      - data-plane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["enterprise"]
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: cyberassess-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cyberassess-redis:/data
    networks:
      - data-plane
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cyberassess-postgres:
  cyberassess-redis:

networks:
  # The standalone service is intentionally kept on its own host-facing
  # network. It is not the enterprise execution plane.
  control-plane:
    driver: bridge
  # Database and queue traffic stays on an internal-only network. No host
  # port is published for either persistence service.
  data-plane:
    driver: bridge
    internal: true
  # The worker's external network is a deployment attachment point for the
  # host firewall/egress gateway. Compose itself does not enforce a target
  # allowlist on this network; production deployment must apply that policy.
  execution-egress:
    driver: bridge
  # Native platform-owned provider clients use this separate attachment.
  # Exact provider URLs remain enforced in application code; destination
  # filtering for all external processes remains an infrastructure control.
  provider-egress:
    driver: bridge
