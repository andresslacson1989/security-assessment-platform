# ==============================================================================
# CyberAssess Platform - Production Docker Compose Orchestration
# Authoritative Contract Reference: contracts/08_TECHNICAL_IMPLEMENTATION_AND_TEST_VECTORS_CONTRACT.md (Section 10.2)
# ==============================================================================

version: '3.8'

services:
  cyberassess:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andresslacson1989/security-assessment-platform:latest
    container_name: cyberassess-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent host volume for scan reports and database
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Enterprise profile: PostgreSQL persistence and Redis Streams dispatch.
  # Keep DATABASE_URL, POSTGRES_PASSWORD, and other credentials outside source control.
  cyberassess-enterprise:
    profiles: ["enterprise"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andresslacson1989/security-assessment-platform:latest
    container_name: cyberassess-platform-enterprise
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must reference the enterprise PostgreSQL service}"
      EXECUTION_QUEUE_URL: "${EXECUTION_QUEUE_URL:?EXECUTION_QUEUE_URL must reference the enterprise Redis service}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set for enterprise mode}"
      ENVIRONMENT: production
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cyberassess-worker:
    profiles: ["enterprise"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/andresslacson1989/security-assessment-platform:latest
    container_name: cyberassess-worker
    restart: unless-stopped
    command: ["python", "/app/run_worker.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must reference the enterprise PostgreSQL service}"
      EXECUTION_QUEUE_URL: "${EXECUTION_QUEUE_URL:?EXECUTION_QUEUE_URL must reference the enterprise Redis service}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set for enterprise mode}"
      ENVIRONMENT: production
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    profiles: ["enterprise"]
    image: postgres:16-alpine
    container_name: cyberassess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-cyberassess}"
      POSTGRES_USER: "${POSTGRES_USER:-cyberassess}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - cyberassess-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["enterprise"]
    image: redis:7-alpine
    container_name: cyberassess-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cyberassess-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cyberassess-postgres:
  cyberassess-redis:
