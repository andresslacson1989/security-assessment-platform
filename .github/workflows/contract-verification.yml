name: Contract Verification

on:
  push:
    branches: [security/nmap-installer-closure]
  pull_request:
    branches: [security/nmap-installer-closure]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-backend:
    name: Compile backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_ROOT: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/compile-backend
      CI_REPORT_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/compile-backend/reports
      CI_PYTEST_BASETEMP: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/compile-backend/pytest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set project-local CI paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ROOT/tmp" "$CI_REPORT_DIR" "$CI_PYTEST_BASETEMP" "$CI_ROOT/pycache"
          {
            echo "TEMP=$CI_ROOT/tmp"
            echo "TMP=$CI_ROOT/tmp"
            echo "TMPDIR=$CI_ROOT/tmp"
            echo "PYTHONPYCACHEPREFIX=$CI_ROOT/pycache"
            echo "PYTEST_BASETEMP=$CI_PYTEST_BASETEMP"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --require-hashes --requirement backend/requirements.lock

      - name: Compile backend modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend

  focused-contract-verification:
    name: Focused contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATING_MODE: TEST
      JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
      CYBERASSESS_LIVE_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      CYBERASSESS_POSTGRES_TEST_URL: postgresql://cyberassess_ci:cyberassess_ci_only@127.0.0.1:5432/cyberassess_ci
      CYBERASSESS_POSTGRES_TEST_ACK: I_UNDERSTAND_DISPOSABLE_DATABASE_MUTATION
      CI_ROOT: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/focused-contract-verification
      CI_REPORT_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/focused-contract-verification/reports
      CI_PYTEST_BASETEMP: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/focused-contract-verification/pytest
      CYBERASSESS_DB_PATH: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/focused-contract-verification/cyberassess.db
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberassess_ci
          POSTGRES_PASSWORD: cyberassess_ci_only
          POSTGRES_DB: cyberassess_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cyberassess_ci -d cyberassess_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set project-local CI paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ROOT/tmp" "$CI_REPORT_DIR" "$CI_PYTEST_BASETEMP" "$CI_ROOT/pycache"
          {
            echo "TEMP=$CI_ROOT/tmp"
            echo "TMP=$CI_ROOT/tmp"
            echo "TMPDIR=$CI_ROOT/tmp"
            echo "PYTHONPYCACHEPREFIX=$CI_ROOT/pycache"
            echo "PYTEST_BASETEMP=$CI_PYTEST_BASETEMP"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --require-hashes --requirement backend/requirements.lock

      - name: Wait for Redis Streams readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if python -c 'import os, redis; client=redis.Redis.from_url(os.environ["CYBERASSESS_LIVE_REDIS_TEST_URL"]); client.ping(); client.close()'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Wait for authenticated PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if python -c 'import os, psycopg; connection=psycopg.connect(os.environ["CYBERASSESS_POSTGRES_TEST_URL"], connect_timeout=2); connection.execute("SELECT 1"); connection.close()'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run focused contract suite
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$CI_REPORT_DIR"
          mkdir -p "$report_dir"
          python -m pytest -p no:cacheprovider -q \
            --basetemp="$PYTEST_BASETEMP" \
            tests/security/test_contract_fleet_consistency.py \
            backend/tests/test_scan_manifest_contract.py \
            backend/tests/test_execution_launch_inventory.py \
            tests/security/test_database_backend.py \
            tests/security/test_auth_admin_boundaries.py \
            tests/security/test_execution_decision_authority.py \
            tests/security/test_execution_cancellation_coordinator.py \
            tests/security/test_real_dispatch_authority_assurance.py \
            tests/security/test_scan_request_migration.py \
            tests/security/test_process_launch_boundary.py \
            tests/security/test_container_hardening.py \
            --junitxml="$report_dir/focused-contract.xml" \
            2>&1 | tee "$report_dir/focused-contract.log"

      - name: Reject unexpected focused-test skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report_path = os.path.join(os.environ["CI_REPORT_DIR"], "focused-contract.xml")
          root = ET.parse(report_path).getroot()
          allowed = {
              "Requires the Windows kernel Job Object API",
              "Windows Job Object lifecycle is covered by the native assurance job",
              "Windows kernel required",
              "historical a1c4fc4 fixture is blocked by its committed v1 artifact mismatch",
          }
          reasons = [node.attrib.get("message", "") for node in root.iter("skipped")]
          unexpected = sorted(reason for reason in reasons if reason not in allowed)
          if unexpected:
              raise SystemExit("Focused contract suite contained unexpected skip(s): " + "; ".join(unexpected))
          PY

      - name: Upload focused evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: focused-contract-evidence-${{ github.run_id }}
          path: ${{ env.CI_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  full-repository-verification:
    name: Full repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPERATING_MODE: TEST
      JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
      CYBERASSESS_LIVE_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      CYBERASSESS_POSTGRES_TEST_URL: postgresql://cyberassess_ci:cyberassess_ci_only@127.0.0.1:5432/cyberassess_ci
      CYBERASSESS_POSTGRES_TEST_ACK: I_UNDERSTAND_DISPOSABLE_DATABASE_MUTATION
      CI_ROOT: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/full-repository-verification
      CI_REPORT_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/full-repository-verification/reports
      CI_PYTEST_BASETEMP: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/full-repository-verification/pytest
      CYBERASSESS_DB_PATH: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/full-repository-verification/cyberassess.db
      FULL_EVIDENCE_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/full-repository-verification/reports
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberassess_ci
          POSTGRES_PASSWORD: cyberassess_ci_only
          POSTGRES_DB: cyberassess_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cyberassess_ci -d cyberassess_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set project-local CI paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ROOT/tmp" "$CI_REPORT_DIR" "$CI_PYTEST_BASETEMP" "$CI_ROOT/pycache"
          {
            echo "TEMP=$CI_ROOT/tmp"
            echo "TMP=$CI_ROOT/tmp"
            echo "TMPDIR=$CI_ROOT/tmp"
            echo "PYTHONPYCACHEPREFIX=$CI_ROOT/pycache"
            echo "PYTEST_BASETEMP=$CI_PYTEST_BASETEMP"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --require-hashes --requirement backend/requirements.lock

      - name: Wait for authenticated PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if python -c 'import os, psycopg; connection=psycopg.connect(os.environ["CYBERASSESS_POSTGRES_TEST_URL"], connect_timeout=2); connection.execute("SELECT 1"); connection.close()'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Wait for Redis Streams readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if python -c 'import os, redis; client=redis.Redis.from_url(os.environ["CYBERASSESS_LIVE_REDIS_TEST_URL"]); client.ping(); client.close()'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run full repository suite
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$FULL_EVIDENCE_DIR"
          mkdir -p "$report_dir"
          python -m pytest -p no:cacheprovider -q \
            --basetemp="$PYTEST_BASETEMP" \
            --junitxml="$report_dir/full-suite.xml" \
            2>&1 | tee "$report_dir/full-suite.log"

      - name: Classify full-suite skips
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import os
          import xml.etree.ElementTree as ET

          report_path = os.path.join(os.environ["FULL_EVIDENCE_DIR"], "full-suite.xml")
          if not os.path.isfile(report_path):
              raise SystemExit("Full-suite JUnit evidence was not produced")
          root = ET.parse(report_path).getroot()
          classifications = {
              "UNAVAILABLE: approved managed Subfinder v2.6.5 binary is not installed":
                  "ENVIRONMENT_UNAVAILABLE_MANAGED_TOOL",
              "Managed nmap binary not present on this dev machine":
                  "ENVIRONMENT_UNAVAILABLE_MANAGED_TOOL",
              "Symlinks require elevated privileges on Windows":
                  "PLATFORM_CAPABILITY_UNAVAILABLE",
              "Symlink creation is unavailable in this environment":
                  "PLATFORM_CAPABILITY_UNAVAILABLE",
              "Unix process sessions are not available on Windows":
                  "PLATFORM_CAPABILITY_UNAVAILABLE",
              "Requires the Windows kernel Job Object API":
                  "PLATFORM_CAPABILITY_UNAVAILABLE_WINDOWS_ASSURANCE_COVERED",
              "Windows Job Object lifecycle is covered by the native assurance job":
                  "PLATFORM_CAPABILITY_UNAVAILABLE_WINDOWS_ASSURANCE_COVERED",
              "Windows kernel required":
                  "PLATFORM_CAPABILITY_UNAVAILABLE_WINDOWS_ASSURANCE_COVERED",
              "historical a1c4fc4 fixture is blocked by its committed v1 artifact mismatch":
                  "PROVENANCE_BLOCKED_ESCALATION_REQUIRED",
          }
          reasons = [node.attrib.get("message", "") for node in root.iter("skipped")]
          unknown = sorted(reason for reason in reasons if reason not in classifications)
          if unknown:
              raise SystemExit("Full repository suite contained unclassified skip(s): " + "; ".join(unknown))
          counts = collections.Counter(reasons)
          output_path = os.path.join(os.environ["FULL_EVIDENCE_DIR"], "full-suite-skip-classification.txt")
          with open(output_path, "w", encoding="utf-8") as output:
              output.write(f"total_skips={len(reasons)}\n")
              for reason in sorted(counts):
                  output.write(f"{classifications[reason]}\t{counts[reason]}\t{reason}\n")
          PY

      - name: Upload full-suite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-repository-evidence-${{ github.run_id }}
          path: ${{ env.CI_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  postgres-schema-assurance:
    name: PostgreSQL 16 schema assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPERATING_MODE: TEST
      JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
      CYBERASSESS_POSTGRES_TEST_URL: postgresql://cyberassess_ci:cyberassess_ci_only@127.0.0.1:5432/cyberassess_ci
      CYBERASSESS_POSTGRES_TEST_ACK: I_UNDERSTAND_DISPOSABLE_DATABASE_MUTATION
      CI_ROOT: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/postgres-schema-assurance
      CI_REPORT_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/postgres-schema-assurance/reports
      CI_PYTEST_BASETEMP: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/postgres-schema-assurance/pytest
      CYBERASSESS_DB_PATH: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/postgres-schema-assurance/cyberassess.db
      POSTGRES_EVIDENCE_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/postgres-schema-assurance/reports
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cyberassess_ci
          POSTGRES_PASSWORD: cyberassess_ci_only
          POSTGRES_DB: cyberassess_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cyberassess_ci -d cyberassess_ci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set project-local CI paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_ROOT/tmp" "$CI_REPORT_DIR" "$CI_PYTEST_BASETEMP" "$CI_ROOT/pycache"
          {
            echo "TEMP=$CI_ROOT/tmp"
            echo "TMP=$CI_ROOT/tmp"
            echo "TMPDIR=$CI_ROOT/tmp"
            echo "PYTHONPYCACHEPREFIX=$CI_ROOT/pycache"
            echo "PYTEST_BASETEMP=$CI_PYTEST_BASETEMP"
          } >> "$GITHUB_ENV"

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir --require-hashes --requirement backend/requirements.lock

      - name: Wait for authenticated PostgreSQL readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if python -c 'import os, psycopg; connection=psycopg.connect(os.environ["CYBERASSESS_POSTGRES_TEST_URL"], connect_timeout=2); connection.execute("SELECT 1"); connection.close()'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Run real PostgreSQL schema assurance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$POSTGRES_EVIDENCE_DIR"
          python -m pytest -p no:cacheprovider -q \
            --basetemp="$PYTEST_BASETEMP" \
            tests/security/test_postgres_integration.py \
            --junitxml="$POSTGRES_EVIDENCE_DIR/postgres-suite.xml" \
            2>&1 | tee "$POSTGRES_EVIDENCE_DIR/postgres-suite.log"

      - name: Reject dependency-gated PostgreSQL skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report_path = os.path.join(os.environ["POSTGRES_EVIDENCE_DIR"], "postgres-suite.xml")
          root = ET.parse(report_path).getroot()
          skipped = int(root.attrib.get("skipped", "0"))
          if skipped:
              raise SystemExit(f"PostgreSQL assurance contained {skipped} skipped test(s)")
          PY

      - name: Upload PostgreSQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-schema-evidence-${{ github.run_id }}
          path: ${{ env.CI_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

  container:
    name: Hardened production image verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag cyberassess-contract-runtime .

      - name: Smoke-test hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --user cyberassess \
            --entrypoint /bin/sh cyberassess-contract-runtime \
            -c 'test "$(id -u)" -ne 0 &&
            test ! -w /app/backend/bin/subfinder &&
            test ! -w /app/backend/bin/subfinder.trust.json &&
            test ! -w /opt/cyberassess/tool-venvs/sslyze/bin/sslyze.trust.json'

      - name: Smoke-test application startup and health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_name=cyberassess-health-smoke
          volume_name=cyberassess-smoke-data
          cleanup() {
            docker logs "$container_name" 2>&1 || true
            docker rm -f -v "$container_name" 2>/dev/null || true
            docker volume rm "$volume_name" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --name "$container_name" \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            -v "$volume_name":/app/data \
            --user cyberassess \
            -p 8000:8000 \
            -e HOST=0.0.0.0 \
            -e PORT=8000 \
            -e OPERATING_MODE=TEST \
            -e JWT_SECRET=ci-only-jwt-secret-012345678901234567890123456789 \
            cyberassess-contract-runtime

          healthy=0
          for attempt in $(seq 1 30); do
            echo "Polling /api/system/health attempt $attempt..."
            http_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/system/health || true)
            if [ "$http_code" = "200" ]; then
              response=$(curl -fsSL http://127.0.0.1:8000/api/system/health)
              echo "Health probe succeeded: $response"
              echo "$response" | grep -iq '"status":"healthy"'
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Health endpoint failed to report healthy within 30 seconds"
            exit 1
          fi

  windows-job-object-assurance:
    name: Windows Job Object assurance
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      OPERATING_MODE: TEST
      JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
      CYBERASSESS_WORKER_IDENTITY: ci-windows-worker
      CYBERASSESS_WORKER_GENERATION: ci-windows-generation-${{ github.run_id }}
      CI_ROOT: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/windows-job-object-assurance
      CI_REPORT_DIR: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/windows-job-object-assurance/reports
      CI_PYTEST_BASETEMP: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/windows-job-object-assurance/pytest
      CYBERASSESS_DB_PATH: ${{ github.workspace }}/.project-temp/contract-verification-${{ github.run_id }}/windows-job-object-assurance/cyberassess.db
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set project-local CI paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $directories = @(
            $env:CI_ROOT,
            $env:CI_REPORT_DIR,
            $env:CI_PYTEST_BASETEMP,
            (Join-Path $env:CI_ROOT "tmp"),
            (Join-Path $env:CI_ROOT "pycache")
          )
          foreach ($directory in $directories) {
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
          }
          @(
            "TEMP=$(Join-Path $env:CI_ROOT 'tmp')",
            "TMP=$(Join-Path $env:CI_ROOT 'tmp')",
            "TMPDIR=$(Join-Path $env:CI_ROOT 'tmp')",
            "PYTHONPYCACHEPREFIX=$(Join-Path $env:CI_ROOT 'pycache')",
            "PYTEST_BASETEMP=$env:CI_PYTEST_BASETEMP"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --no-cache-dir --require-hashes --requirement backend/requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile backend modules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m compileall -q backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows Job Object assurance tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $reportPath = Join-Path $env:CI_REPORT_DIR "windows-job-object.xml"
          $logPath = Join-Path $env:CI_REPORT_DIR "windows-job-object.log"
          $nodeids = @(
            "backend/tests/test_execution_context_contract.py::test_windows_ownership_rejects_replayed_incomplete_and_cross_binding_proofs",
            "backend/tests/test_execution_context_contract.py::test_windows_attestation_json_is_strict_and_representation_preserving",
            "backend/tests/test_execution_context_contract.py::test_posix_attestation_json_rejects_identity_type_coercion",
            "backend/tests/test_execution_launch_inventory.py::test_windows_governed_launch_uses_native_job_list_and_has_no_pid_fallback",
            "backend/tests/test_execution_launch_inventory.py::test_every_windows_supervisor_launch_uses_a_typed_job_attestation",
            "backend/tests/test_execution_launch_inventory.py::test_production_recovery_never_reopens_windows_jobs_by_name",
            "tests/security/test_process_launch_boundary.py::test_windows_job_atomic_assignment_and_descendant_termination",
            "tests/security/test_process_launch_boundary.py::test_windows_job_restart_attachment_and_name_collision",
            "tests/security/test_process_launch_boundary.py::test_windows_job_recovery_attachment_accepts_only_attested_surviving_members",
            "tests/security/test_process_launch_boundary.py::test_windows_worker_crash_kill_on_close_blocks_durable_reattachment",
            "tests/security/test_process_launch_boundary.py::test_expired_windows_attestation_stays_recovery_blocked_without_refresh",
            "tests/security/test_process_launch_boundary.py::test_windows_supervisor_cancellation_requires_attested_identity",
            "tests/security/test_process_launch_boundary.py::test_windows_non_scan_launch_uses_attested_job_boundary",
            "tests/security/test_process_launch_boundary.py::test_windows_non_scan_timeout_output_cancellation_and_exception_are_typed",
            "tests/security/test_process_launch_boundary.py::test_process_supervisor_rejects_ambiguous_governed_and_non_scan_capabilities",
            "tests/security/test_execution_decision_authority.py::test_governed_process_rejection_is_durably_settled_after_authority_claim"
          )
          & python -m pytest -p no:cacheprovider -q `
            "--basetemp=$env:CI_PYTEST_BASETEMP" `
            @nodeids `
            "--junitxml=$reportPath" 2>&1 | Tee-Object -FilePath $logPath
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 0) { exit $pytestExit }

      - name: Reject Windows assurance skips
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportPath = Join-Path $env:CI_REPORT_DIR "windows-job-object.xml"
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Windows Job Object JUnit evidence was not produced"
          }
          [xml]$report = Get-Content -LiteralPath $reportPath -Raw
          $suites = @($report.testsuites.testsuite)
          $testCount = ($suites | ForEach-Object { [int]$_.tests } | Measure-Object -Sum).Sum
          $skipCount = ($suites | ForEach-Object { [int]$_.skipped } | Measure-Object -Sum).Sum
          $failureCount = ($suites | ForEach-Object { [int]$_.failures } | Measure-Object -Sum).Sum
          $errorCount = ($suites | ForEach-Object { [int]$_.errors } | Measure-Object -Sum).Sum
          if ($testCount -le 0) { throw "Windows Job Object assurance produced no tests" }
          if ($skipCount -ne 0) { throw "Windows Job Object assurance contained $skipCount skipped test(s)" }
          if ($failureCount -ne 0 -or $errorCount -ne 0) {
            throw "Windows Job Object assurance JUnit evidence reports failures or errors"
          }

      - name: Upload Windows assurance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-job-object-evidence-${{ github.run_id }}
          path: ${{ env.CI_REPORT_DIR }}/
          if-no-files-found: error
          retention-days: 14

