name: Contract Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full repository verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement backend/requirements.lock

      - name: Run complete test suite
        env:
          OPERATING_MODE: TEST
          JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
        run: python -m pytest -q

  container:
    name: Hardened production image verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag cyberassess-contract-runtime .

      - name: Smoke-test hardened runtime
        run: >-
          docker run --rm --read-only --cap-drop=ALL
          --security-opt=no-new-privileges
          --tmpfs /tmp:rw,noexec,nosuid,nodev
          --user cyberassess
          --entrypoint /bin/sh cyberassess-contract-runtime
          -c 'test "$(id -u)" -ne 0 &&
          test ! -w /app/backend/bin/subfinder &&
          test ! -w /app/backend/bin/subfinder.trust.json &&
          test ! -w /opt/cyberassess/tool-venvs/sslyze/bin/sslyze.trust.json'

      - name: Smoke-test application startup and health endpoint
        run: |
          docker run -d --name cyberassess-health-smoke \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --tmpfs /app/data:rw,noexec,nosuid,nodev \
            --user cyberassess \
            -p 8000:8000 \
            -e HOST=0.0.0.0 \
            -e PORT=8000 \
            -e OPERATING_MODE=TEST \
            -e JWT_SECRET=ci-only-jwt-secret-012345678901234567890123456789 \
            cyberassess-contract-runtime

          HEALTHY=0
          for i in $(seq 1 30); do
            echo "Polling /api/system/health attempt $i..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/system/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              RESPONSE=$(curl -fsSL http://127.0.0.1:8000/api/system/health)
              echo "Health probe succeeded: $RESPONSE"
              echo "$RESPONSE" | grep -q '"status":"healthy"' || exit 1
              HEALTHY=1
              break
            fi
            sleep 1
          done

          docker logs cyberassess-health-smoke
          docker stop cyberassess-health-smoke
          docker rm cyberassess-health-smoke

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Health endpoint failed to report healthy within 30 seconds"
            exit 1
          fi

