stages:
  - verify

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

default:
  image: python:3.11-slim
  interruptible: true
  before_script:
    - python --version
    - python -m pip install --require-hashes --requirement backend/requirements.lock

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  OPERATING_MODE: TEST
  JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789

full-repository-verification:
  stage: verify
  timeout: 15 minutes
  script:
    - python -m pytest -q

postgres-schema-assurance:
  stage: verify
  image: python:3.11-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: cyberassess_ci
    POSTGRES_PASSWORD: cyberassess_ci_only
    POSTGRES_DB: cyberassess_ci
    CYBERASSESS_POSTGRES_TEST_URL: postgresql://cyberassess_ci:cyberassess_ci_only@postgres:5432/cyberassess_ci
    CYBERASSESS_POSTGRES_TEST_ACK: I_UNDERSTAND_DISPOSABLE_DATABASE_MUTATION
  before_script:
    - python --version
    - python -m pip install --require-hashes --requirement backend/requirements.lock
    - >-
      ready=0; for i in $(seq 1 60); do python -c "import socket; socket.create_connection(('postgres', 5432), 1).close()" && ready=1 && break || sleep 1; done; test "$ready" = 1
  script:
    - python -m pytest -q tests/security/test_postgres_integration.py
